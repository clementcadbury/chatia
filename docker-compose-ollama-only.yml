services:
  # Service Ollama avec llama3.2:1b
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-chatia
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # Support GPU NVIDIA GTX 1050
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Service pour télécharger le modèle llama3.2:1b
  ollama-setup:
    image: ollama/ollama:latest
    container_name: ollama-setup
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: |
      sh -c "
        echo 'Attente du démarrage d''Ollama...'
        sleep 10
         echo 'Téléchargement du modèle llama3.2:3b...'
         ollama pull llama3.2:3b
         echo 'Modèle llama3.2:3b installé avec succès!'
      "
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: "no"

volumes:
  ollama_data:
    driver: local
