version: '3.8'

services:
  chatia-led-controller:
    build: .
    container_name: chatia-led-controller
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - chatia-network

networks:
  chatia-network:
    driver: bridge
